<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>勤怠入力画面 - 勤怠管理システム</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ccc; padding-bottom: 10px; }
        .container { max-width: 500px; margin: 40px auto; text-align: center; }
        .btn-group { display: flex; justify-content: space-around; margin: 20px 0; }
        .select-btn { width: 160px; height: 60px; font-size: 1.1em; border: 2px solid #555; background: #fff; cursor: pointer; border-radius: 6px; }
        .select-btn.selected { background: #555; color: #fff; font-weight: bold; }
        .submit-btn { width: 200px; height: 50px; font-size: 1.1em; background: #1976d2; color: #fff; border: none; border-radius: 6px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
<div class="header">
    <div><span th:text="${loginUser.userName}"></span>さん</div>
    <a th:href="@{/logout}"><button type="button">ログアウト</button></a>
</div>

<div class="container">
    <h2>勤怠入力</h2>
    <form th:action="@{/attendance}" method="post" onsubmit="return validateSelection()">
        <input type="hidden" id="attendanceType" name="attendanceType" required>
        <input type="hidden" id="workStatusId" name="workStatusId" required>

        <div class="btn-group">
            <button type="button" class="select-btn type-btn" onclick="selectType('0', this)">出勤</button>
            <button type="button" class="select-btn type-btn" onclick="selectType('1', this)">退勤</button>
        </div>

        <div class="btn-group">
            <button type="button" class="select-btn status-btn" onclick="selectStatus('W01', this)">出社</button>
            <button type="button" class="select-btn status-btn" onclick="selectStatus('W02', this)">在宅</button>
        </div>

        <button type="submit" class="submit-btn">決定</button>
    </form>
</div>

<script>
    function selectType(val, btn) {
        document.getElementById('attendanceType').value = val;
        document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
    }
    function selectStatus(val, btn) {
        document.getElementById('workStatusId').value = val;
        document.querySelectorAll('.status-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
    }
    function validateSelection() {
        if (!document.getElementById('attendanceType').value || !document.getElementById('workStatusId').value) {
            alert('「出勤/退勤」と「出社/在宅」をそれぞれ選択してください。');
            return false;
        }
        return true;
    }
</script>
</body>
</html>
