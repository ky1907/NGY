<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>勤怠入力画面 - 勤怠管理システム</title>
    <!-- 最新の共通メニューCSSを呼び出し -->
    <th:block th:replace="~{common :: menuStyle}"></th:block>
    <style>
        /* メインカード */
        .container { max-width: 520px; margin: 40px auto; background: #fff; padding: 30px; border: 1px solid #ddd; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); text-align: center; }
        .btn-group { display: flex; justify-content: space-around; margin: 20px 0; gap: 15px; }

        .select-attendance-btn { flex: 1; height: 60px; font-size: 1.1em; border: 2px solid #555; background: #00eeff; color: #fff; cursor: pointer; border-radius: 6px; transition: all 0.15s; }
        .select-attendance-btn:hover { background: #21a6ad; }
        .select-attendance-btn.selected { background: #21a6ad; color: #fff; font-weight: bold; }

        .select-leaving-btn { flex: 1; height: 60px; font-size: 1.1em; border: 2px solid #555; background: #ff2727; color: #fff; cursor: pointer; border-radius: 6px; transition: all 0.15s; }
        .select-leaving-btn:hover { background: #b82323; }
        .select-leaving-btn.selected { background: #b82323; color: #fff; font-weight: bold; }

        .select-office-btn { flex: 1; height: 60px; font-size: 1.1em; border: 2px solid #555; background: #97ff56; color: #fff; cursor: pointer; border-radius: 6px; transition: all 0.15s; }
        .select-office-btn:hover { background: #67bb32; }
        .select-office-btn.selected { background: #67bb32; color: #fff; font-weight: bold; }

        .select-home-btn { flex: 1; height: 60px; font-size: 1.1em; border: 2px solid #555; background: #ffa930; color: #fff; cursor: pointer; border-radius: 6px; transition: all 0.15s; }
        .select-home-btn:hover { background: #cc8726; }
        .select-home-btn.selected { background: #cc8726; color: #fff; font-weight: bold; }

        #workStatusArea { display: none; }
        #workStatusArea.show { display: block; }

        .submit-btn { width: 200px; height: 50px; font-size: 1.1em; background: #1976d2; color: #fff; border: none; border-radius: 6px; cursor: pointer; margin-top: 20px; font-weight: bold; }
        .submit-btn:hover { background: #1565c0; }
    </style>
</head>
<body>
<div class="main-content">
    <!-- 共通上部ヘッダー -->
    <div class="top-bar">
        <div class="user-info">
            <a>ID : <span th:if="${loginUser != null}" th:text="${loginUser.userId}">ユーザID</span></a>
            <a>名前 : <span th:if="${loginUser != null}" th:text="${loginUser.userName}">名前</span></a>
        </div>
        <!-- 共通三本線ボタンを呼び出し -->
        <th:block th:replace="~{common :: hamburgerBtn}"></th:block>
    </div>

    <div class="container">
        <h2>勤怠登録</h2>
        <form th:action="@{/attendance}" method="post" onsubmit="return validateSelection()">
            <input type="hidden" id="attendanceType" name="attendanceType">
            <input type="hidden" id="workStatusId" name="workStatusId">

            <!-- 出勤 / 退勤 選択 -->
            <div class="btn-group">
                <button type="button" class="select-attendance-btn type-btn" onclick="selectType('0', this)">出勤</button>
                <button type="button" class="select-leaving-btn type-btn" onclick="selectType('1', this)">退勤</button>
            </div>

            <!-- 出社 / 在宅 選択（出勤時のみ表示） -->
            <div id="workStatusArea">
                <div class="btn-group">
                    <button type="button" class="select-office-btn status-btn" onclick="selectStatus('W01', this)">出社</button>
                    <button type="button" class="select-home-btn status-btn" onclick="selectStatus('W02', this)">在宅</button>
                </div>
            </div>

            <button type="submit" class="submit-btn">決定</button>
        </form>
    </div>
</div>

<!-- 最新の共通水色スライドメニューを呼び出し -->
<th:block th:replace="~{common :: sideMenu}"></th:block>

<script>
    function selectType(val, btn) {
        document.getElementById('attendanceType').value = val;
        document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');

        const statusArea = document.getElementById('workStatusArea');
        if (val === '0') {
            // 出勤時のみ出社・在宅エリアを表示
            statusArea.classList.add('show');
        } else {
            // 退勤時は出社・在宅エリアを隠し、選択値をクリア
            statusArea.classList.remove('show');
            document.getElementById('workStatusId').value = '';
            document.querySelectorAll('.status-btn').forEach(b => b.classList.remove('selected'));
        }
    }

    function selectStatus(val, btn) {
        document.getElementById('workStatusId').value = val;
        document.querySelectorAll('.status-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
    }

    function validateSelection() {
        const typeVal = document.getElementById('attendanceType').value;
        const statusVal = document.getElementById('workStatusId').value;

        if (!typeVal) {
            alert('「出勤」または「退勤」を選択してください。');
            return false;
        }
        // 出勤（'0'）のときだけ出社・在宅の選択をチェック
        if (typeVal === '0' && !statusVal) {
            alert('出勤時は「出社」または「在宅」を選択してください。');
            return false;
        }
        // 退勤（'1'）の場合は退勤登録後にログアウトされる旨を確認
        if (typeVal === '1') {
            return confirm('退勤を登録してログアウトしますか？');
        }
        return true;
    }
</script>
</body>
</html>
