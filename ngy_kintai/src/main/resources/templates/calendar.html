<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>個人カレンダー (S0103)</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 共通メニューCSS -->
    <th:block th:replace="~{common :: menuStyle}"></th:block>
    <style>
        .calendar-grid-wrapper {
            position: relative;
        }
        .cal-week-row {
            position: relative;
            min-height: 125px;
            border-bottom: 1px solid #dee2e6;
        }
        .cal-week-row:last-child {
            border-bottom: none;
        }
        .cal-week-bg {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            position: absolute;
            inset: 0;
            pointer-events: none;
        }
        .cal-day-bg {
            border-right: 1px solid #dee2e6;
            padding: 6px 8px;
            height: 100%;
        }
        .cal-day-bg:last-child {
            border-right: none;
        }
        .other-month {
            background-color: #f8f9fa;
            color: #adb5bd;
        }
        .today-cell {
            background-color: #fff9db;
        }
        .cal-day-headers {
            position: relative;
            z-index: 2;
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            pointer-events: none;
        }
        .cal-day-header {
            padding: 6px 8px 0 8px;
        }
        .cal-week-bars {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            padding-top: 32px;
            padding-bottom: 8px;
            row-gap: 4px;
        }
        .cal-event-bar {
            font-size: 0.8rem;
            cursor: pointer;
            margin: 0 2px;
            padding: 3px 8px;
            border-radius: 5px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 500;
            line-height: 1.45;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
        }

        /* 予定カラーバリエーション */
        .color-sky    { background-color: #cfe2ff; color: #084298; border-left: 4px solid #0d6efd; }
        .color-blue   { background-color: #9ec5fe; color: #052c65; border-left: 4px solid #0a58ca; }
        .color-green  { background-color: #d1e7dd; color: #0f5132; border-left: 4px solid #198754; }
        .color-amber  { background-color: #fff3cd; color: #664d03; border-left: 4px solid #ffc107; }
        .color-rose   { background-color: #f8d7da; color: #842029; border-left: 4px solid #dc3545; }
        .color-purple { background-color: #e2d9f3; color: #3d1e73; border-left: 4px solid #6f42c1; }
    </style>
</head>
<body class="bg-light">

<div class="container mt-3 mb-5">
    <!-- 上部ヘッダー：左にタイトル、右上に三本線メニューボタン -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">個人カレンダー</h2>
        <div th:replace="~{common :: hamburgerBtn}"></div>
    </div>

    <!-- 操作バー：左側に「+ 予定を追加」、中央に「前月・年月・次月」 -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <button type="button" class="btn btn-primary" onclick="openCreateModal()">+ 予定を追加</button>
        </div>

        <div class="d-flex align-items-center">
            <a th:href="@{/calendar(year=${prevYear}, month=${prevMonth})}" class="btn btn-outline-secondary btn-sm">&lt; 前月</a>
            <span class="fs-4 fw-bold mx-3" th:text="${currentYear + '年 ' + currentMonth + '月'}"></span>
            <a th:href="@{/calendar(year=${nextYear}, month=${nextMonth})}" class="btn btn-outline-secondary btn-sm">次月 &gt;</a>
        </div>

        <!-- 右側のバランス用スペース -->
        <div style="width: 115px;"></div>
    </div>

    <!-- 月間カレンダー本体 -->
    <div class="card shadow-sm">
        <div class="card-body p-0 calendar-grid-wrapper">
            <!-- 曜日ヘッダー -->
            <div class="row g-0 border-bottom bg-light text-center fw-bold py-2">
                <div class="col text-danger">日</div>
                <div class="col">月</div>
                <div class="col">火</div>
                <div class="col">水</div>
                <div class="col">木</div>
                <div class="col">金</div>
                <div class="col text-primary">土</div>
            </div>

            <!-- 週ごとの行 -->
            <div th:each="weekRow : ${weekRows}" class="cal-week-row">
                <!-- 背景の7日分マス目 -->
                <div class="cal-week-bg">
                    <div th:each="day : ${weekRow.days}"
                         class="cal-day-bg"
                         th:classappend="${day.monthValue != currentMonth ? 'other-month' : ''} + (${day.equals(today)} ? ' today-cell' : '')">
                    </div>
                </div>

                <!-- 各日の日付数字・「今日」バッジ -->
                <div class="cal-day-headers">
                    <div th:each="day : ${weekRow.days}" class="cal-day-header d-flex justify-content-between align-items-center">
                        <span class="fw-bold"
                              th:classappend="${day.dayOfWeek.value == 7} ? 'text-danger' : (${day.dayOfWeek.value == 6} ? 'text-primary' : '')"
                              th:text="${day.dayOfMonth}">1</span>
                        <span th:if="${day.equals(today)}" class="badge bg-warning text-dark" style="font-size: 0.65rem;">今日</span>
                    </div>
                </div>

                <!-- 貫通する横棒エリア -->
                <div class="cal-week-bars">
                    <div th:each="bar : ${weekRow.bars}"
                         class="cal-event-bar"
                         th:classappend="${'color-' + bar.color}"
                         th:style="'grid-column: ' + ${bar.startCol} + ' / span ' + ${bar.spanCols} + ';'"
                         th:text="${bar.label}"
                         th:attr="data-id=${bar.calendarId},
                                  data-title=${bar.title},
                                  data-start=${bar.startTimeInput},
                                  data-end=${bar.endTimeInput},
                                  data-detail=${bar.detail},
                                  data-color=${bar.color}"
                         onclick="openEditModalFromEl(this)">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 予定 登録・編集モーダル -->
<div class="modal fade" id="eventModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/calendar/save}" method="post">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">予定の登録</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="calendarId" name="calendarId">

                    <div class="mb-3">
                        <label class="form-label">タイトル</label>
                        <input type="text" class="form-control" id="title" name="title" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">表示カラー</label>
                        <select class="form-select" id="eventColor" name="eventColor">
                            <option value="sky">水色（通常・業務）</option>
                            <option value="blue">青（会議・打ち合わせ）</option>
                            <option value="green">緑（休暇・外出）</option>
                            <option value="amber">黄色（注意・リマインド）</option>
                            <option value="rose">赤（重要・締切）</option>
                            <option value="purple">紫（その他）</option>
                        </select>
                    </div>
                    <div class="row">
                        <div class="col mb-3">
                            <label class="form-label">開始日時</label>
                            <input type="datetime-local" class="form-control" id="startTime" name="startTime" required>
                        </div>
                        <div class="col mb-3">
                            <label class="form-label">終了日時</label>
                            <input type="datetime-local" class="form-control" id="endTime" name="endTime" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">詳細メモ</label>
                        <textarea class="form-control" id="detail" name="detail" rows="3"></textarea>
                    </div>
                </div>
                <div class="modal-footer justify-content-between">
                    <button type="button" class="btn btn-danger" id="deleteBtn" style="display:none;" onclick="deleteEvent()">削除</button>
                    <div>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
                        <button type="submit" class="btn btn-primary">保存</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- 共通スライドメニュー本体 -->
<th:block th:replace="~{common :: sideMenu}"></th:block>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const modal = new bootstrap.Modal(document.getElementById('eventModal'));

    function openCreateModal() {
        document.getElementById('modalTitle').innerText = '予定の登録';
        const idInput = document.getElementById('calendarId');
        idInput.value = '';
        idInput.disabled = true;
        document.getElementById('title').value = '';
        document.getElementById('eventColor').value = 'sky';
        document.getElementById('startTime').value = '';
        document.getElementById('endTime').value = '';
        document.getElementById('detail').value = '';
        document.getElementById('deleteBtn').style.display = 'none';
        modal.show();
    }

    function openEditModalFromEl(el) {
        document.getElementById('modalTitle').innerText = '予定の編集';
        const idInput = document.getElementById('calendarId');
        idInput.disabled = false;
        idInput.value = el.getAttribute('data-id') || '';
        document.getElementById('title').value = el.getAttribute('data-title') || '';
        document.getElementById('eventColor').value = el.getAttribute('data-color') || 'sky';
        document.getElementById('startTime').value = el.getAttribute('data-start') || '';
        document.getElementById('endTime').value = el.getAttribute('data-end') || '';
        document.getElementById('detail').value = el.getAttribute('data-detail') || '';
        document.getElementById('deleteBtn').style.display = 'inline-block';
        modal.show();
    }

    function deleteEvent() {
        const id = document.getElementById('calendarId').value;
        if (id && confirm('この予定を削除しますか？')) {
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = '/calendar/delete/' + id;
            document.body.appendChild(form);
            form.submit();
        }
    }
</script>
</body>
</html>
