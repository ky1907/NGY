<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- 各画面の <head> 内で呼び出す共通CSS -->
    <th:block th:fragment="menuStyle">
        <style>
            * { box-sizing: border-box; }
            body {
                font-family: sans-serif;
                margin: 0;
                padding: 0;
                background-color: #fff;
                min-height: 100vh;
            }
            .main-content {
                padding: 20px 30px;
            }
            /* 上部ヘッダー（左上にユーザID・名前、右上に三本線ボタン） */
            .top-bar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 20px;
            }
            .user-info {
                display: flex;
                gap: 30px;
                font-size: 1.1em;
            }
            /* 右上の四角く囲われた横三本線ボタン */
            .hamburger-btn {
                width: 44px;
                height: 44px;
                background-color: #d9d9d9;
                border: 2px solid #000;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 6px;
                cursor: pointer;
                padding: 0;
                z-index: 1100;
            }
            .hamburger-btn span {
                display: block;
                width: 24px;
                height: 3px;
                background-color: #000;
            }
            /* ボタンを押したときに開く水色スライドメニュー */
            .side-menu {
                position: fixed;
                top: 0;
                right: -250px;
                width: 240px;
                height: 100vh;
                background-color: #a8fff0;
                padding: 75px 22px 20px;
                transition: right 0.3s ease;
                z-index: 1000;
                box-shadow: -2px 0 6px rgba(0,0,0,0.15);
            }
            .side-menu.open {
                right: 0;
            }
            .menu-items a {
                display: block;
                color: #000;
                text-decoration: none;
                font-size: 1.15em;
                margin-bottom: 16px;
                line-height: 1.3;
            }
            .menu-items a:hover {
                text-decoration: underline;
            }
            .menu-items a.logout-link {
                color: #ff0000;
                font-size: 1.35em;
                margin-top: 24px;
            }
        </style>
    </th:block>
</head>
<body>

    <!-- ① 右上の三本線ボタン（ヘッダー右端に配置） -->
    <button th:fragment="hamburgerBtn" type="button" class="hamburger-btn" onclick="toggleSideMenu()" aria-label="メニューを開く">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <!-- ② 水色スライドメニュー本体＋開閉スクリプト（</body>直前に配置） -->
    <th:block th:fragment="sideMenu">
        <div id="sideMenu" class="side-menu">
            <div class="menu-items">
                <a th:href="@{/attendance}">勤怠登録</a>
                <a th:href="@{/calender}">カレンダー</a>
                <a th:href="@{/mail}">メール</a>
                <a th:href="@{/contact_add}">連絡先</a>
                <a th:href="@{/work_location}">勤務場所</a>
                <a th:href="@{/working_status}">部署内勤務状況</a>
                <th:block th:if="${loginUser.roleId == 'R01'}">
                    <a th:href="@{/user_edit}">ユーザ登録</a>
                    <a th:href="@{/working_time}">勤務時間参照</a>
                </th:block>
                <a th:href="@{/logout}" class="logout-link">ログアウト</a>
            </div>
        </div>
        <script>
            function toggleSideMenu() {
                document.getElementById('sideMenu').classList.toggle('open');
            }
        </script>
    </th:block>

</body>
</html>
