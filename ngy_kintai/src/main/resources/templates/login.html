<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ログイン画面 - 勤怠管理システム</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f5f5f5; }
        .login-box { background: #fff; padding: 30px 40px; border: 1px solid #ccc; border-radius: 6px; width: 340px; text-align: center; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        .error { color: red; font-size: 0.9em; margin-bottom: 10px; }
        button { width: 100%; padding: 10px; background: #333; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
<div class="login-box">
    <h2>勤怠管理システム</h2>
    <p class="error" th:if="${errorMsg}" th:text="${errorMsg}"></p>
    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="userId">ユーザーID（半角数字8桁）</label>
            <input type="text" id="userId" name="userId" maxlength="8" pattern="[0-9]{8}" required>
        </div>
        <div class="form-group">
            <label for="password">パスワード（6〜16桁）</label>
            <input type="password" id="password" name="password" minlength="6" maxlength="16" required>
        </div>
        <button type="submit">ログイン</button>
    </form>
</div>
</body>
</html>
